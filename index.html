        body {
            font-family: Arial, sans-serif;

            justify-content: center;

            margin: 0;
            background-color: #ffffff;

        }
        .loading-box {
            text-align: center;
            padding: 20px;
        }
        
        /* Bulatan Berpusing "Tunggu Jap" */
        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0066cc; /* Warna biru */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 18px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #333333;
        }
        p {
            font-size: 0.85rem;
            color: #777777;
        }
        a {
            color: #0066cc;
            text-decoration: underline;
        }
    </style>
